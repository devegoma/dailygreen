services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-dailygreen}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db-network

  web:
    build:
      context: ./web-app
      target: dev
    env_file:
      - ./web-app/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-dailygreen}}
    volumes:
      - ./web-app:/app
      - web_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - db-network

  notification-scheduler:
    build:
      context: ./notification-scheduler
    env_file:
      - ./notification-scheduler/.env
    environment:
      INTERNAL_JOB_URL: http://web:5173/internal/jobs/push-dispatch
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app-network

  reverse-proxy:
    image: "nginx:1.29.6"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - web
    networks:
      - edge-network
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:
      - path: /etc/dailygreen/cloudflared.env
        required: false
    depends_on:
      - reverse-proxy
    restart: unless-stopped
    networks:
      - edge-network

networks:
  edge-network:
    driver: bridge
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  web_node_modules:
