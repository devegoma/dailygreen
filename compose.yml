services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-dailygreen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dailygreen-network

  web:
    build:
      context: ./web-app
      target: dev
    environment:
      PORT: "80"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-dailygreen}}
    volumes:
      - ./web-app:/app
      - web_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dailygreen-network

  reverse-proxy:
    image: "nginx:1.29.6"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/cert:/etc/nginx/cert
    depends_on:
      - web
    networks:
      - dailygreen-network

volumes:
  postgres_data:
  web_node_modules:

networks:
  dailygreen-network:
    driver: bridge
    attachable: true
