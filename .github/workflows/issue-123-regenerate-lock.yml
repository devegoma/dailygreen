name: Regenerate security fix lockfile (temporary)

on:
  push:
    branches:
      - fix/issue-123-tanstack-start-xss

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web-app/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web-app/.node-version
          cache: pnpm
          cache-dependency-path: web-app/pnpm-lock.yaml
      - name: Regenerate pnpm lockfile
        working-directory: web-app
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify patched versions
        working-directory: web-app
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          const lines = lock.split(String.fromCharCode(10));
          for (const [name, patchedVersion] of [['react-start', '1.168.60'], ['start-server-core', '1.169.39']]) {
            const prefix = "  '@tanstack/" + name + "@";
            const versions = [...new Set(lines.filter((line) => line.startsWith(prefix)).map((line) => line.slice(prefix.length).split("'")[0].split('(')[0]))];
            if (versions.length !== 1 || versions[0] !== patchedVersion) {
              throw new Error('Unexpected @tanstack/' + name + ' versions: ' + JSON.stringify(versions));
            }
          }
          NODE
      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-app/pnpm-lock.yaml
          git diff --cached --exit-code && exit 0
          git commit -m 'fix(security): regenerate TanStack Start lockfile (#123)'
          git push origin HEAD:"${GITHUB_REF_NAME}"
