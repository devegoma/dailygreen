name: Fix Push SSR Temp

on:
  push:
    branches:
      - agent/fix-push-ssr-build

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-push-ssr-build

      - name: Rename browser-safe module
        run: |
          set -eux
          git mv web-app/src/features/push/push-notifications.client.ts web-app/src/features/push/push-notifications.browser.ts
          git mv web-app/src/features/push/push-notifications.client.test.ts web-app/src/features/push/push-notifications.browser.test.ts
          sed -i 's#push-notifications\.client#push-notifications.browser#g' web-app/src/features/push/notification-settings-card.tsx
          sed -i 's#push-notifications\.client#push-notifications.browser#g' web-app/src/features/push/push-notifications.browser.test.ts
          rm .github/workflows/fix-push-ssr-temp.yml

      - name: Commit fixes
        run: |
          set -eux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Push通知UIのSSR buildを修正'
          git push origin HEAD:agent/fix-push-ssr-build
