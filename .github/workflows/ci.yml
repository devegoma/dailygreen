name: CI

on:
  pull_request:

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://user:password@localhost:5432/dailygreen_test
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-123456
  BETTER_AUTH_URL: http://localhost:5173
  GOOGLE_CLIENT_ID: test-google-client-id
  GOOGLE_CLIENT_SECRET: test-google-client-secret

jobs:
  check:
    name: Test, Lint, Typecheck and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # packageManager フィールド（web-app/package.json）からバージョンを取得
          package_json_file: web-app/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: web-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check:ci
      - run: pnpm run typecheck
      - run: pnpm run build
