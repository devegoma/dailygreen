name: Issue 124 one-time formatter
on:
  push:
    branches: [security/issue-124-push-hardening]
    paths:
      - .github/workflows/issue-124-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'devegoma/dailygreen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/issue-124-push-hardening
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web-app/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web-app/.node-version
          cache: pnpm
          cache-dependency-path: web-app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web-app
        run: pnpm install --frozen-lockfile
      - name: Apply Biome formatting
        working-directory: web-app
        run: pnpm exec biome check --write .
      - name: Commit formatting and delete this one-time workflow
        run: |
          rm .github/workflows/issue-124-format-once.yml
          git add -A web-app .github/workflows/issue-124-format-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(push): apply Biome formatting to issue 124 changes"
          git push origin HEAD:security/issue-124-push-hardening
