name: Generate Dispatch Route Temp

on:
  push:
    branches: [agent/push-dispatch]

permissions:
  contents: write

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://user:password@localhost:5432/dailygreen_test
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-123456
  BETTER_AUTH_URL: http://localhost:5173
  GOOGLE_CLIENT_ID: test-google-client-id
  GOOGLE_CLIENT_SECRET: test-google-client-secret

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/push-dispatch
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web-app/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web-app/.node-version
          cache: pnpm
          cache-dependency-path: web-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web-app
      - run: pnpm run build
        working-directory: web-app
      - name: Commit generated route tree and remove temporary workflow
        run: |
          rm .github/workflows/generate-dispatch-route-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-app/src/routeTree.gen.ts .github/workflows/generate-dispatch-route-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Push dispatchのroute treeを生成"
          git push origin HEAD:agent/push-dispatch
