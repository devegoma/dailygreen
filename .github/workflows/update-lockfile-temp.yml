name: Update Lockfile Temp

on:
  push:
    branches: [agent/push-web-push-dependency]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/push-web-push-dependency
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web-app/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web-app/.node-version
          cache: pnpm
          cache-dependency-path: web-app/pnpm-lock.yaml
      - run: pnpm install --lockfile-only
        working-directory: web-app
      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/update-lockfile-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-app/pnpm-lock.yaml .github/workflows/update-lockfile-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Web Push依存のlockfileを更新"
          git push origin HEAD:agent/push-web-push-dependency
