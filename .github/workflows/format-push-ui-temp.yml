name: Format Push UI Temp

on:
  push:
    branches: [agent/push-notification-ui]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/push-notification-ui
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web-app/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web-app/.node-version
          cache: pnpm
          cache-dependency-path: web-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web-app
      - run: pnpm exec biome check --write src/features/home/home-main-content.tsx src/features/push/notification-settings-card.tsx src/features/push/push-notifications.client.ts src/features/push/push-notifications.client.test.ts
        working-directory: web-app
      - name: Commit formatted files and remove temporary workflow
        run: |
          rm .github/workflows/format-push-ui-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-app/src/features/home/home-main-content.tsx web-app/src/features/push/notification-settings-card.tsx web-app/src/features/push/push-notifications.client.ts web-app/src/features/push/push-notifications.client.test.ts .github/workflows/format-push-ui-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Push通知UIをBiome整形"
          git push origin HEAD:agent/push-notification-ui
