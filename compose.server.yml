services:
  db:
    extends:
      file: compose.yml
      service: db

  migrate:
    build:
      context: ./web-app
      target: migrator
    env_file:
      - ./web-app/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-dailygreen}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - db-network

  web:
    extends:
      file: compose.yml
      service: web
    build:
      target: runner
    environment:
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully

  notification-scheduler:
    extends:
      file: compose.yml
      service: notification-scheduler
    environment:
      INTERNAL_JOB_URL: http://web:3000/internal/jobs/push-dispatch

  reverse-proxy:
    extends:
      file: compose.yml
      service: reverse-proxy
    volumes:
      - ./nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:
      - ${CLOUDFLARED_ENV_FILE:-/etc/dailygreen/cloudflared.env}
    depends_on:
      - reverse-proxy
    restart: unless-stopped
    networks:
      - edge-network

networks:
  edge-network:
    driver: bridge
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
