services:
  db:
    extends:
      file: compose.yml
      service: db

  web:
    extends:
      file: compose.yml
      service: web
    build:
      target: runner
    environment:
      PORT: 3000

  notification-scheduler:
    extends:
      file: compose.yml
      service: notification-scheduler
    environment:
      INTERNAL_JOB_URL: http://web:3000/internal/jobs/push-dispatch

  reverse-proxy:
    extends:
      file: compose.yml
      service: reverse-proxy
    volumes:
      - ./nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:
      - path: /etc/dailygreen/cloudflared.env
        required: false
    depends_on:
      - reverse-proxy
    restart: unless-stopped
    networks:
      - edge-network

networks:
  edge-network:
    driver: bridge
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
